name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # TimescaleDB (not plain postgres) is required: the schema uses the
      # timescaledb extension and create_hypertable. This runs the PostgreSQL
      # integration tests that are otherwise skipped when DATABASE_URL is unset.
      postgres:
        image: timescale/timescaledb:2.17.0-pg16
        env:
          POSTGRES_USER: urushi
          POSTGRES_PASSWORD: urushi
          POSTGRES_DB: urushi_chronicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urushi -d urushi_chronicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://urushi:urushi@localhost:5432/urushi_chronicle?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Build
        run: go build ./...

      - name: Apply migrations
        run: go run ./cmd/migrate

      - name: Test
        run: go test -v -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend

  frontend:
    name: Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src/

      - name: Format check
        run: npx biome format src/

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
